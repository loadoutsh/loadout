name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `loadout doctor`. It catches most problems and its
        output is the single most useful thing you can include.

        **Do not paste your config or `loadout env` output without checking it
        first** — run `loadout scan`. Security issues go to SECURITY.md, not
        here.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: loadout doctor
      description: Paste the full output.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `loadout version`.
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed how
      options: [install.sh, Homebrew, go install, built from source]
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and shell
      placeholder: "macOS 15.1 arm64, zsh 5.9"
    validations:
      required: true

  - type: textarea
    id: generated
    attributes:
      label: Relevant generated shell
      description: |
        For anything about an alias or function, the relevant lines from
        `~/.config/loadout/init.zsh`. Read them first — they reflect your config.
      render: shell
