# Shipped alias catalog. Generated from the original .aliases.d files;
# command strings are verbatim. Edit here, not there.
#
# pack:      empty means a core default, on for everyone
# platform:  empty means all platforms
# requires:  binaries that must exist for the alias to work
aliases:
  - name: "ctl"
    platforms:
      linux: "sudo systemctl"
      darwin: "sudo launchctl"
    category: config
  - name: "ctl:status"
    platforms:
      linux: "sudo systemctl status"
      darwin: "sudo launchctl list"
    category: config
  - name: "ctl:start"
    platforms:
      linux: "sudo systemctl start"
      darwin: "sudo launchctl start"
    category: config
  - name: "ctl:stop"
    platforms:
      linux: "sudo systemctl stop"
      darwin: "sudo launchctl stop"
    category: config
  - name: "ctl:enable"
    platforms:
      linux: "sudo systemctl enable"
      darwin: "sudo launchctl enable"
    category: config
  - name: "ctl:disable"
    platforms:
      linux: "sudo systemctl disable"
      darwin: "sudo launchctl disable"
    category: config
  - name: "zcon"
    command: "code ~/.zshrc"
    category: config
    requires: ["code"]
  - name: "zcon:n"
    command: "nano ~/.zshrc"
    category: config
    requires: ["nano"]
  - name: "omz"
    command: "code ~/.oh-my-zsh"
    category: config
    requires: ["code"]
    comment: "directory"
  - name: "zrc"
    command: ". ~/.zshrc"
    category: config
    comment: "refresh/source"
  - name: "ezrc"
    command: "exec zsh"
    category: config
    comment: "hard refresh"
  - name: "debi"
    command: "sudo dpkg -i"
    category: config
    platform: [linux]
    requires: ["dpkg"]
    comment: "linux"
  - name: "downloads"
    command: "cd ~/Downloads"
    category: config
  - name: ".."
    command: "cd .."
    category: config
    comment: "one step back"
  - name: "..."
    command: "cd ../.."
    category: config
    comment: "two steps back"
  - name: "...."
    command: "cd ../../../"
    category: config
    comment: "three steps back"
  - name: "cl"
    command: "clear"
    category: config
  - name: "me"
    command: "whoami"
    category: config
  - name: "app"
    platforms:
      linux: "sudo apt-get"
      darwin: "brew"
    category: config
  - name: "update"
    platforms:
      linux: "sudo apt-get update -y && sudo apt-get upgrade"
      darwin: "brew update && brew upgrade"
    category: config
  - name: "h"
    command: "history"
    category: config
  - name: "date:now"
    command: "date +\"%T\""
    category: config
  - name: "today"
    command: "date +\"%d-%m-%Y\""
    category: config
  - name: "wget"
    command: "wget -c"
    category: config
    requires: ["wget"]
  - name: "ports"
    platforms:
      linux: "netstat -tulanp"
      darwin: "lsof -i -P"
    category: config
  - name: "j"
    command: "jobs -l"
    category: config
  - name: "sa"
    command: "ssh-add"
    category: config
    requires: ["ssh-add"]
  - name: "sal"
    command: "ssh-add -l"
    category: config
    requires: ["ssh-add"]
