<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>loadout</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <!-- The mark, inlined rather than <img>, so the rule and slugs inherit
           currentColor and stay legible in both colour schemes. Geometry is the
           brand's full cut verbatim; only the slot carries colour. -->
      <h1 class="brand">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect
            x="3.5"
            y="3.5"
            width="93"
            height="93"
            fill="none"
            stroke="currentColor"
            stroke-width="7"
          />
          <rect x="18" y="18" width="64" height="18" fill="currentColor" />
          <rect x="18" y="42" width="29" height="40" fill="currentColor" />
          <rect x="53" y="42" width="29" height="17" fill="currentColor" />
          <rect x="53" y="65" width="29" height="17" fill="var(--slot)" />
        </svg>
        loadout
      </h1>
      <div class="meta" id="meta"></div>
      <button id="apply" class="primary" disabled>Review &amp; apply</button>
    </header>

    <nav id="tabs">
      <button data-tab="overview" class="active">Overview</button>
      <button data-tab="aliases">Aliases</button>
      <button data-tab="commands">Commands</button>
      <button data-tab="packs">Packs</button>
      <button data-tab="credentials">Credentials</button>
    </nav>

    <main>
      <section id="overview" class="tab active"></section>
      <section id="aliases" class="tab">
        <div class="toolbar">
          <input
            type="search"
            id="alias-filter"
            placeholder="Filter aliases, commands, categories…"
            autocomplete="off"
          />
          <label
            ><input type="checkbox" id="only-problems" /> only unavailable</label
          >
          <span class="count" id="alias-count"></span>
        </div>
        <div id="alias-list"></div>
      </section>
      <section id="commands" class="tab"></section>
      <section id="packs" class="tab"></section>
      <section id="credentials" class="tab"></section>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button id="modal-close" aria-label="Close">&times;</button>
        </div>
        <div id="modal-body"></div>
        <div class="modal-foot" id="modal-foot"></div>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
