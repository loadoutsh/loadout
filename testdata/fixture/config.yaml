# Test fixture: a configuration exercising every section of the schema.
#
# The golden test renders this for both shells and both platforms, so any
# change to the catalog or a template shows up as a diff in testdata/golden.
# Keep it broad rather than tidy: a section not represented here is a section
# no test covers.
#
# Emails, hostnames and paths are illustrative, not real.
version: 1

paths:
  project_root: ~/Projects
  venv_root: ~/.venv

git:
  main_branch: main
  dev_branch: development

ssh:
  default_key: box-b
  default_user: root
  default_host: 10.0.0.2
  default_port: 22
  subnet_prefix: 10.0.0.

editors:
  - name: code
    command: code
  - name: ut
    command: /opt/vscode-portable/bin/code

node_versions: ["16", "18", "20", "22", "24"]

npm_globals:
  - tldr
  - "@nestjs/cli"
  - pm2
  - serve
  - ts-node-dev
  - npm-check-updates
  - degit
  - corepack
  - dbdocs
  - "@infisical/cli"
  - prettier

# Named secrets with one active entry each. Values live in the OS keychain,
# never here. This replaces the old habit of commenting out NPM_TOKEN lines
# in .env to switch between them.
credentials:
  npm_token:
    active: personal
    entries: [personal, work]
  gh_token:
    active: personal
    entries: [personal, work]

identities:
  - id: default
    git_user: Example User
    email: default@example.com
    ssh_key: ~/.ssh/id_rsa
    default: true
  - id: gp
    git_user: Example Two
    email: gp@example.com
    ssh_key: ~/.ssh/id_two
  - id: ut
    git_user: Example Three
    email: ut@example.com
    ssh_key: ~/.ssh/id_three
  - id: fin
    git_user: Example Three
    email: fin@example.com
    ssh_key: ~/.ssh/id_four
  - id: five
    git_user: Example Four
    email: five@example.com
    ssh_key: ~/.ssh/id_five
    # Switching to this identity also swaps these credential entries, so one
    # command changes git author, SSH key and tokens together.
    activates:
      npm_token: work
      gh_token: work
  # No ssh_key: ~/.ssh/config picks the key, for example from a hardware- or
  # TPM-backed agent, so switching to this identity leaves the agent alone.
  - id: agentless
    git_user: Example Five
    email: agentless@example.com

hosts:
  # Shortcut hosts also emit a bare `ssh <alias>` alias.
  - alias: box-a
    hostname: box-a
    user: root
    shortcut: true
  - alias: box-b
    hostname: box-b
    user: root
    shortcut: true
  - alias: edge-a
    hostname: edge-a
    user: root
    shortcut: true
  - alias: edge-b
    hostname: edge-b
    user: root
    shortcut: true
  # Upload targets for mpush.
  - alias: api
    hostname: api.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: broker
    hostname: broker.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: py
    hostname: py.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: fr
    hostname: static.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: wb
    hostname: wb.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~

workspaces:
  - name: api
    path: ~/Projects/api/api.code-workspace
    tmux_session: api
  - name: api-web
    path: ~/Projects/api-web/api-web.code-workspace
    tmux_session: api-web
  - name: docs
    path: ~/Projects/docs/docs.code-workspace
    tmux_session: docs
  - name: tools
    path: ~/Projects/tools/tools.code-workspace

clone_sources:
  - alias: clone-eg
    org: example-org

binaries:
  - name: duckdb
    version: v1.1.3
    source:
      github: duckdb/duckdb
      asset:
        linux-amd64: duckdb_cli-linux-amd64.zip
        darwin-arm64: duckdb_cli-osx-universal.zip
    # Verified against the real v1.1.3 linux-amd64 asset. A checksum only
    # covers the platform it was taken from, so darwin needs its own entry
    # before it can be verified there.
    checksum: sha256:efd0fccdb1a28d9ec7a6ebfcde59900068b8ba43a846c9b553c0fd2bbe4acf43

# The scripts the original bin/ directory put on PATH. bin/fmt is absent
# deliberately: it is dev tooling for this repo, not something loadout ships.
scripts:
  - name: csf
    source: builtin
  - name: sshp
    source: builtin
  - name: tmux-session
    source: builtin

# Everything the original environment had switched on.
packs: [gatsby, jekyll, flutter, exercism, git-flow, cloudflared, ansible]

aliases:
  custom:
    # VPN and tunnel aliases. Genuinely personal: a wireguard interface name,
    # one specific .ovpn file, one named cloudflared tunnel. A proper `vpn`
    # pack with its own config is a follow-up; for now they live here, which
    # is exactly what custom aliases are for.
    - name: dns
      command: cloudflared tunnel route dns dev
    - name: vpn-up
      command: sudo wg-quick up office
      platform: [linux]
    - name: vpn-down
      command: sudo wg-quick down office
      platform: [linux]
    - name: vup
      command: vpn-up
    - name: vdn
      command: vpn-down
    - name: ov
      command: openvpn3
      platform: [linux]
    - name: ovi
      command: ov config-import --config /opt/vpn/office.ovpn --name office --tag work
      platform: [linux]
    - name: ovl
      command: ov configs-list
      platform: [linux]
    - name: ovc
      command: ov session-start -c office
      platform: [linux]
    - name: ovd
      command: ov session-manage --disconnect -c office
      platform: [linux]
    - name: "xsm:cd"
      command: cd $HOME/snap/exercism/current
