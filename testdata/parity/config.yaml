# Parity fixture: the configuration that reproduces the pre-loadout shell
# environment. Used by the parity test to prove the generator emits the same
# aliases the hand-written .aliases.d files did.
#
# Emails and hostnames here are placeholders. The originals came from an
# untracked .env; moving them into config is the point of the migration, so
# they are deliberately not real values.
version: 1

paths:
  project_root: ~/Projects
  venv_root: ~/.venv

git:
  main_branch: main
  dev_branch: development

ssh:
  default_key: sucasa
  default_user: root
  default_host: 10.0.0.2
  default_port: 22
  subnet_prefix: 10.0.0.

editors:
  - name: code
    command: code
  - name: ut
    command: /home/wc/.vscode-portable/utopia/VSCode-linux-x64/bin/code

node_versions: ["16", "18", "20", "22", "24"]

npm_globals:
  - qotm
  - "@nestjs/cli"
  - pm2
  - serve
  - ts-node-dev
  - npm-check-updates
  - degit
  - corepack
  - dbdocs
  - "@infisical/cli"
  - prettier

identities:
  - id: default
    git_user: WessCoby
    email: default@example.com
    ssh_key: ~/.ssh/id_rsa
    default: true
  - id: gp
    git_user: GP
    email: gp@example.com
    ssh_key: ~/.ssh/gp_id_rsa
  - id: ut
    git_user: Emmanuel Sekyere
    email: ut@example.com
    ssh_key: ~/.ssh/ut_es_ed
  - id: fin
    git_user: Emmanuel Sekyere
    email: fin@example.com
    ssh_key: ~/.ssh/fin_es_ed
  - id: wc
    git_user: Wess
    email: wc@example.com
    ssh_key: ~/.ssh/wc_ed

hosts:
  # Shortcut hosts: these also emit a bare `ssh <alias>` alias, matching the
  # micasa/sucasa/micaddy/sucaddy aliases from config.aliases.
  - alias: micasa
    hostname: micasa
    user: root
    shortcut: true
  - alias: sucasa
    hostname: sucasa
    user: root
    shortcut: true
  - alias: micaddy
    hostname: micaddy
    user: root
    shortcut: true
  - alias: sucaddy
    hostname: sucaddy
    user: root
    shortcut: true
  # Upload targets, previously the *_MACHINE variables read by mpush.
  - alias: api
    hostname: api.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: broker
    hostname: broker.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: py
    hostname: py.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: fr
    hostname: static.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~
  - alias: wb
    hostname: wb.example.internal
    user: azureuser
    key: ~/.ssh/deploy
    upload_path: ~

workspaces:
  - name: a11
    path: ~/Projects/acme/api/api.code-workspace
    tmux_session: a11
  - name: a11-wb
    path: ~/Projects/svt/acme/wb/a11-wb.code-workspace
    tmux_session: a11-wb
  - name: inerds
    path: ~/Projects/inerds/web/inerds.code-workspace
    tmux_session: inerds
  - name: snipify
    path: ~/Projects/wt/snipify/snipify.code-workspace

clone_sources:
  - alias: wt
    org: wesnetech

binaries:
  - name: duckdb
    version: v1.1.3
    source:
      github: duckdb/duckdb
      asset:
        linux-amd64: duckdb_cli-linux-amd64.zip
        darwin-arm64: duckdb_cli-osx-universal.zip

# Everything the original environment had switched on.
packs: [gatsby, jekyll, flutter, exercism, git-flow, cloudflared, ansible]

aliases:
  custom:
    # VPN and tunnel aliases. Genuinely personal: a wireguard interface name,
    # one specific .ovpn file, one named cloudflared tunnel. A proper `vpn`
    # pack with its own config is a follow-up; for now they live here, which
    # is exactly what custom aliases are for.
    - name: dns
      command: cloudflared tunnel route dns dev
    - name: vpn-up
      command: sudo wg-quick up ut
      platform: [linux]
    - name: vpn-down
      command: sudo wg-quick down ut
      platform: [linux]
    - name: vup
      command: vpn-up
    - name: vdn
      command: vpn-down
    - name: ov
      command: openvpn3
      platform: [linux]
    - name: ovi
      command: ov config-import --config /home/wc/Projects/svt/utopia/misc/openvpn/v_dev_pt_56.ovpn --name ut --tag utopia
      platform: [linux]
    - name: ovl
      command: ov configs-list
      platform: [linux]
    - name: ovc
      command: ov session-start -c ut
      platform: [linux]
    - name: ovd
      command: ov session-manage --disconnect -c ut
      platform: [linux]
    - name: "xsm:cd"
      command: cd /home/wc/snap/exercism/5/exercism
